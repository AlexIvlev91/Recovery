# Push a tag like v1.0.0 to build RecoveryGui.exe and recover.exe and publish them as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish single exes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/Recovery.Gui -p:PublishProfile=SingleExe -p:Version=$version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish src/Recovery.Cli -p:PublishProfile=SingleExe -p:Version=$version

      - name: Package with licenses
        shell: pwsh
        run: |
          $name = 'Recovery-${{ github.ref_name }}-win-x64'
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item publish/RecoveryGui.exe, publish/recover.exe, LICENSE, THIRD-PARTY-NOTICES.md, README.md $name
          Copy-Item licenses $name -Recurse
          Compress-Archive $name "$name.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag publish/RecoveryGui.exe publish/recover.exe "Recovery-$tag-win-x64.zip" --title "Recovery $tag" --generate-notes
